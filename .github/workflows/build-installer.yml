name: Build Installer Firmware

# Baut die neutrale Firmware (ohne persoenliche Zugangsdaten), fuegt sie zu
# einem flashbaren Image zusammen und aktualisiert docs/firmware.bin.
# GitHub Pages (Quelle: Branch main, Ordner /docs) serviert dann die Install-Seite.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO + esptool installieren
        run: pip install --upgrade platformio esptool

      - name: Firmware bauen (neutral)
        run: pio run -e installer

      - name: Zu flashbarem Image zusammenfuehren
        run: |
          B=.pio/build/installer
          BOOT_APP0=$(find "$HOME/.platformio" -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOT_APP0"
          mkdir -p docs
          python -m esptool --chip esp32 merge-bin -o docs/firmware.bin \
            --flash-mode dio --flash-freq 40m --flash-size 4MB \
            0x1000  "$B/bootloader.bin" \
            0x8000  "$B/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"

      - name: Manifest-Version aktualisieren
        run: |
          VER="build-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          python - "$VER" <<'PY'
          import json, sys
          p = "docs/manifest.json"
          with open(p) as f: m = json.load(f)
          m["version"] = sys.argv[1]
          with open(p, "w") as f: json.dump(m, f, indent=2); f.write("\n")
          PY

      - name: docs/ committen (falls geaendert)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware.bin docs/manifest.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung an docs/ – nichts zu committen."
          else
            git commit -m "CI: Installer-Firmware aktualisiert [skip ci]"
            git push
          fi
