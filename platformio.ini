; PlatformIO Projekt-Konfiguration
; ESP32 DevKit v1 (ESP32-WROOM-32, ESP32-D0WD-V3)

[platformio]
; Lokale, ungetrackte Overrides (z. B. OTA-Passwort) einbinden.
extra_configs = platformio_local.ini

; ---- Basis: Flashen per USB ----
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; OTA-faehiges Partitionsschema (zwei App-Partitionen: ota_0 / ota_1)
board_build.partitions = default.csv

; Serieller Monitor
monitor_speed = 115200
monitor_port = /dev/cu.usbserial-0001
upload_port = /dev/cu.usbserial-0001

; Libraries: U8g2 (unterstuetzt SSD1306 UND SH1106 korrekt)
lib_deps =
    olikraus/U8g2@^2.35.30

; Nuetzliche Monitor-Filter (Reset-Timestamps, ESP-Exception-Decoder)
monitor_filters =
    esp32_exception_decoder
    time

; ---- OTA: Flashen ueber WLAN (pio run -e ota -t upload) ----
; Hostname .local oder feste IP als upload_port eintragen.
[env:ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
upload_port = esp32-oled.local
; upload_flags (--auth=...) kommt aus platformio_local.ini (nicht im Git)
